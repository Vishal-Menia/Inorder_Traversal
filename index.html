<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Binary Tree Traversal</title>
   <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Binary Tree Inorder Traversal</h1>
        
        <div class="instructions">
            <p>Add nodes to build your tree. Click "Start Traversal" to see the Inorder Traversal.</p>
        </div>
        
        <div class="controls">
            <div class="input-group">
                <input type="number" id="nodeValue" placeholder="Value" min="1" max="99">
                <button id="addBtn">Add Node</button>
            </div>
            <button id="startBtn">Start Traversal</button>
            <button id="resetBtn">Reset Tree</button>
        </div>
        
        <div class="tree-container">
            <div class="tree" id="tree"></div>
        </div>
        
        <div class="traversal-display" id="traversalDisplay"></div>
    </div>
<script src="Inorder.js">

</script>
   
</body>
</html>
